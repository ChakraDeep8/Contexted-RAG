[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "context-ingestion"
version = "0.1.0"
description = "Incremental document ingestion pipeline for a context-only RAG chatbot"
requires-python = ">=3.11,<3.13"
dependencies = [
  "docling==2.139.0",
  "openpyxl==3.1.5",
  "onnxruntime==1.31.0",
  "platformdirs==4.5.0",
  "pydantic-settings==2.14.0",
  "rapidocr==3.10.0",
  "rich==14.2.0",
  "watchfiles==1.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

